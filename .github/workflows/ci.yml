name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: build, unit tests, browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No dependencies to install — the project is deliberately dependency-free.
      - name: Build
        run: node tools/build.mjs

      - name: Fail if docs/ is out of date with src/
        run: |
          if ! git diff --quiet -- docs/; then
            echo "::error::docs/ is stale. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- docs/
            exit 1
          fi

      - name: Unit tests
        run: node tools/test.mjs

      - name: Browser tests (headless Chromium)
        run: node tools/browser-test.mjs
