name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: build, unit tests, browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No dependencies to install — the project is deliberately dependency-free.
      - name: Build
        run: node tools/build.mjs

      - name: Fail if docs/ is out of date with src/
        run: |
          if ! git diff --quiet -- docs/; then
            echo "::error::docs/ is stale. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- docs/
            exit 1
          fi

      - name: Unit tests
        run: node tools/test.mjs

      # ubuntu-latest ships Google Chrome; resolve it explicitly rather than
      # relying on a binary name that differs between images.
      - name: Locate a Chromium-based browser
        run: |
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BIN" ]; then
            echo "::error::no Chromium-based browser on the runner"; exit 1
          fi
          echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN" --version

      - name: Browser tests (headless Chromium)
        run: node tools/browser-test.mjs

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots/
          if-no-files-found: ignore
